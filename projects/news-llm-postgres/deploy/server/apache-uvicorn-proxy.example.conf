# Apache reverse proxy örneği.
# Mevcut vhost dosyalarını ezmeden ayrı conf olarak eklenmeli.
# Örnek hedef:
#   https://example.com/omer-news-dashboard-live/

ProxyPreserveHost On

ProxyPass "/omer-news-dashboard-live/" "http://127.0.0.1:8011/"
ProxyPassReverse "/omer-news-dashboard-live/" "http://127.0.0.1:8011/"

