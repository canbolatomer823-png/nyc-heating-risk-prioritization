services:
  news-dashboard:
    image: nginx:1.27-alpine
    container_name: news-dashboard
    restart: unless-stopped
    ports:
      - "${NEWS_DASHBOARD_PORT:-8080}:80"
    volumes:
      - ../../outputs/dashboard.html:/usr/share/nginx/html/index.html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
