services:
  news-dashboard:
    image: nginx:1.27-alpine
    container_name: ${NEWS_DASHBOARD_CONTAINER:-omer-news-dashboard}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NEWS_DASHBOARD_PORT:-18080}:80"
    volumes:
      - ../../outputs/dashboard.html:/usr/share/nginx/html/index.html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
