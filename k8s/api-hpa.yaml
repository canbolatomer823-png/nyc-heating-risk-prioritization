apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nhr-api-hpa
  namespace: nyc-heat-risk
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nhr-api
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
